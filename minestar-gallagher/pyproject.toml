[dependency-groups]
dev = [
    "gallagher>=1.0.0a17",
]
[project]
name = "minestar-gallagher"
version = "0.1.0"
description = "MineStar to Gallagher AOZ competency sync"
requires-python = ">=3.10"
dependencies = [
    "gallagher",
    "sqlalchemy",
    "aiosqlite",
    "pydantic-settings",
    "tenacity",
    "fastapi",
    "uvicorn",
    "structlog",
    "pywin32",
    "python-dotenv",
    "pyodbc",
]

[tool.ruff]
line-length = 100