name: "CodeQL Advanced"

on:
  push:
    branches: [ "Gamerk204201-python-test1" ]
  pull_request:
    branches: [ "Gamerk204201-python-test1" ]
  schedule:
    - cron: '36 14 * * 5'

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ (matrix.language == 'swift' && 'macos-latest') || 'windows-latest' }}
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
        - language: actions
          build-mode: none
        - language: python
          build-mode: none

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: ${{ matrix.language }}
        build-mode: ${{ matrix.build-mode }}

    - name: Run manual build steps
      if: matrix.build-mode == 'manual'
      shell: pwsh
      run: |
        Write-Host 'If you are using a "manual" build mode for one or more of the'
        Write-Host 'languages you are analyzing, replace this with the commands to build'
        Write-Host 'your code, for example:'
        Write-Host '  make bootstrap'
        Write-Host '  make release'
        exit 1

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
      with:
        category: "/language:${{matrix.language}}"
